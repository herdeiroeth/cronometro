<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronômetro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Cronômetro</h1>

    <div class="display" id="display" aria-live="polite">
      <span class="time" id="time">00:00.00</span>
    </div>

    <div class="controls">
      <button id="startPause" class="btn btn-primary">Iniciar</button>
      <button id="lap" class="btn" disabled>Volta</button>
      <button id="reset" class="btn btn-ghost" disabled>Zerar</button>
    </div>

    <ol class="laps" id="laps" aria-label="Voltas registradas"></ol>

    <section class="leaderboard" aria-label="Ranking de tempos">
      <h2>Ranking (local)</h2>

      <form class="save-row" id="saveForm" autocomplete="off">
        <input
          type="text"
          id="playerName"
          class="name-input"
          placeholder="Seu nome"
          maxlength="24"
          aria-label="Nome para salvar no ranking"
        />
        <button type="submit" id="saveScore" class="btn btn-primary" disabled>
          Salvar tempo
        </button>
      </form>

      <ol class="ranking" id="ranking" aria-label="Melhores tempos salvos"></ol>

      <button id="clearRanking" class="btn btn-ghost clear-btn" disabled>
        Limpar ranking
      </button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
